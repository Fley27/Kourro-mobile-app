name: CI (mobile-app)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint || true
      - name: Publish lint summary
        if: always()
        run: |
          echo "## Lint" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: Typecheck
    needs: lint
    if: ${{ needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck
        run: npm run build
      - name: Publish typecheck summary
        if: always()
        run: |
          echo "## Typecheck" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  unit:
    name: Unit Tests
    needs: typecheck
    if: ${{ needs.typecheck.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Jest unit tests (if present)
        if: [ -f jest.config.js ] || [ -f jest.config.ts ] || ls src/**/*.test.* 1>/dev/null 2>&1
        run: npx jest --ci --coverage --coverageReporters=text --coverageReporters=lcov || true
      - name: Publish unit summary
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  report:
    name: Consolidated Report
    needs: [lint, typecheck, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_PAT }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish this repo's results to dashboard data
        run: |
          mkdir -p dashboard-data
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sha="${{ github.sha }}"
          run="${{ github.run_id }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${run}"
          cat > dashboard-data/mobile-app.json <<EOF
          {"repo":"Fley27/Kourro-mobile-app","run_id":${run},"sha":"${sha}","updated_at":"${now}","lint":"${{ needs.lint.result }}","typecheck":"${{ needs.typecheck.result }}","unit":"${{ needs.unit.result }}","component":"${{ needs.unit.result }}","e2e":"${{ needs.unit.result }}","url":"${url}"}
EOF
      - name: Commit dashboard data
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.DASHBOARD_PAT }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard-data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(dashboard): publish mobile test results"
            git push
          else
            echo "No changes to report dashboard."
          fi
      - name: Trigger cross-repo dashboard refresh (root repo)
        if: ${{ secrets.DASHBOARD_PAT != '' }}
        continue-on-error: true
        run: |
          curl -s -X POST https://api.github.com/repos/Fley27/Kourro/dispatches \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"test-results-published","client_payload":{"repo":"${{ github.repository }}","run_id":"${{ github.run_id }}"}}' >/dev/null || true
